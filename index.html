<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow: hidden; }
        #game-container { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #multiplier { font-size: 60px; color: #00ff00; margin-bottom: 20px; }
        #penguin { font-size: 80px; position: absolute; bottom: 150px; transition: transform 0.1s linear; }
        .btn { padding: 20px 40px; font-size: 20px; border-radius: 10px; border: none; font-weight: bold; width: 200px; }
        #startBtn { background: #00ff00; }
        #cashBtn { background: #ffcc00; display: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="multiplier">x1.00</div>
        <div id="penguin">🐧</div>
        <button id="startBtn" class="btn" onclick="start()">ВЗЛЁТ!</button>
        <button id="cashBtn" class="btn" onclick="take()">ЗАБРАТЬ!</button>
    </div>

    <script>
        let m = 1.0;
        let active = false;
        let timer;

        function start() {
            m = 1.0;
            active = true;
            let limit = Math.random() * 5 + 1.2; // Шанс краша от 1.2 до 6.2

            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('cashBtn').style.display = 'block';
            document.getElementById('multiplier').style.color = '#00ff00';

            timer = setInterval(() => {
                m += 0.02;
                document.getElementById('multiplier').innerText = 'x' + m.toFixed(2);
                
                // ДВИЖЕНИЕ ПИНГВИНА ВВЕРХ
                let p = document.getElementById('penguin');
                p.style.transform = `translateY(-${(m - 1) * 60}px)`;

                if (m >= limit) {
                    clearInterval(timer);
                    active = false;
                    document.getElementById('multiplier').innerText = 'УЛЕТЕЛ!';
                    document.getElementById('multiplier').style.color = 'red';
                    document.getElementById('cashBtn').style.display = 'none';
                    setTimeout(() => { document.getElementById('startBtn').style.display = 'block'; }, 2000);
                }
            }, 50);
        }

        function take() {
            if (active) {
                clearInterval(timer);
                active = false;
                alert('Победа! Множитель: x' + m.toFixed(2));
                document.getElementById('cashBtn').style.display = 'none';
                document.getElementById('startBtn').style.display = 'block';
            }
        }
    </script>
</body>
</html>
